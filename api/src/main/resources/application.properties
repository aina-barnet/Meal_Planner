spring.application.name=meal-planner-api

# Defaults target the dev workflow (database from `docker compose up db`, API from the IDE).
# docker-compose.yml overrides the URL for the containerised API.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mealplanner}
spring.datasource.username=${DB_USER:mealplanner}
spring.datasource.password=${DB_PASSWORD:mealplanner}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/api/openapi
